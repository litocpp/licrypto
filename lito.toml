[package]
name = "licrypto"
version = "0.2.1"
license = "MIT OR Apache-2.0"
authors = ["hypengw <hypengwip@gmail.com>"]

[lib]
name = "licrypto"
module = "licrypto"
archive = "licrypto"

[[test]]
name = "licrypto-tests"
sources = ["tests/base64.cpp", "tests/main.cpp", "tests/md5.cpp", "tests/sha1.cpp", "tests/sha256.cpp", "tests/sha512.cpp", "tests/hmac_sha256.cpp", "tests/state.cpp", "tests/tls_session.cpp", "tests/tls_stream.cpp", "tests/checksum.cpp"]

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-std = { version = "0.1.11", pub = true }

[dev-dependencies]
rstd-test = { version = "0.1.11" }

[features.openssl]
default = false

[external-dependencies.pkg-config.openssl]
module = "openssl"
version = ">= 3.5"
condition = "feature.openssl"
